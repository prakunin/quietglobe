name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Intel runner: hosted macOS arm64 runners are often unavailable (capacity);
    # the build is universal (arm64 + x86_64) either way.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: bash scripts/test.sh
      - name: Build (ad-hoc signed)
        run: bash scripts/build.sh
